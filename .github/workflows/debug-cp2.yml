name: Debug CP2 precheck

on:
  push:
    branches: [feature/v99-automation-suite]

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate scanner sources through CP1
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force generated | Out-Null
          python tools/generate_image_scan_v4_sources.py --source-root . --output-dir generated
          if ($LASTEXITCODE -ne 0) { throw 'generator failed' }
          python tools/apply_pre_close_x_patch.py --source-root . --output-dir generated
          if ($LASTEXITCODE -ne 0) { throw 'pre-close patch failed' }
          foreach($patch in @('apply_ui30_controller_base.py','apply_ui30_controller_groups.py','apply_ui30_controller_runtime.py','apply_ui30_scanner.py','apply_v99_automation_cp1.py')){
            python (Join-Path tools $patch) --source-root . --output-dir generated
            if ($LASTEXITCODE -ne 0) { throw "$patch failed" }
          }
      - name: Upload generated CP1 sources
        uses: actions/upload-artifact@v4
        with:
          name: cp2-generated-inputs
          path: |
            generated/image_scan_test.cpp
            generated/image_scan_auto_ext.inl
            generated/controller.cpp
          if-no-files-found: error
