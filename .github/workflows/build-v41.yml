name: Build v4.7 AUTO Thần Long đa tính năng Pro

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'src/**'
      - 'tools/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AUTO_DUNGEON_RUNTIME_TEST_PLAN.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved v4.7 source migration
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import subprocess, sys
          subprocess.check_call([sys.executable, 'tools/apply_v47_release.py'])
          subprocess.check_call([sys.executable, 'tools/apply_v47_ui_followup.py'])

      - name: Verify inherited safety contracts
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          source = Path('tools/verify_v152_clean.py').read_text(encoding='utf-8')
          replacements = {
              "== '4.4'": "== '4.7'",
              "VERSION 4.4": "VERSION 4.7",
              "FILEVERSION 4,4,0,0": "FILEVERSION 4,7,0,0",
              "PRODUCTVERSION 4,4,0,0": "PRODUCTVERSION 4,7,0,0",
              "Pro v4.4": "Pro v4.7",
              "Pro_v4.4.exe": "Pro_v4.7.exe",
              "Pro-v4.4-win-x64.zip": "Pro-v4.7-win-x64.zip",
              "0x00040200u": "0x00040700u",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          temp = Path('tools/_verify_v47_ci.py')
          temp.write_text(source, encoding='utf-8')
          try:
              subprocess.check_call([sys.executable, str(temp)])
              subprocess.check_call([sys.executable, 'tools/test_tlmaster_contract.py'])
          finally:
              temp.unlink(missing_ok=True)
          print('inherited safety contracts PASS under v4.7 product/version normalization')

      - name: Verify v4.7 approved contracts
        shell: python
        run: |
          from pathlib import Path

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def require(path, needle, message):
              if needle not in text(path):
                  raise SystemExit(message)

          if text('VERSION.txt').strip() != '4.7':
              raise SystemExit('VERSION.txt is not 4.7')
          require('CMakeLists.txt', 'project(ThanLongItemConsolidator VERSION 4.7', 'CMake project version is not 4.7')
          require('resources/app.rc', 'FILEVERSION 4,7,0,0', 'EXE VERSIONINFO is not 4.7')
          require('src/protocol.h', '0x00040700u', 'bridge protocol is not v4.7')
          require('src/controller.cpp', 'parallelLaneCursor', 'multi-waypoint parallel runtime state missing')
          require('src/controller.cpp', '!a.profile.enableRevive && !a.dungeonOwned', 'dungeon-owned revive override missing')
          require('src/controller.cpp', 'IDC_DG_AUTO_SELL=729', 'dungeon Auto Sell checkbox control missing')
          require('src/dungeon_v45_logic.h', 'sameLane', 'parallel lane validation missing')
          require('src/dungeon_app_methods.inl', 'mỗi lane chạy tuần tự waypoint riêng', 'parallel lane scheduler missing')
          require('src/dungeon_app_methods.inl', 'WAIT ENTER • ', 'indefinite WAIT ENTER missing')
          require('src/dungeon_app_methods.inl', 'WAIT EXIT • ', 'indefinite WAIT EXIT missing')
          require('src/dungeon_app_methods.inl', 'CHỜ ĐẦU THAI • giữ nguyên STEP/lane hiện tại', 'death/resume hold missing')
          require('src/dungeon_app_methods.inl', 'AUTO BÁN khi ô trống <', 'approved Dungeon Auto Sell checkbox missing')
          require('src/dungeon_app_methods.inl', 'ParseEditInt(dungeonSellThresholdEdit_, 15', 'Dungeon sell threshold default 15 missing')
          require('src/dungeon_app_methods.inl', 'ShowWindow(h, SW_HIDE)', 'Dungeon tab foreign-control hide gate missing')
          require('src/dungeon_v45_methods.inl', 'CACHED GẦN NHẤT', 'Activity last-good cache missing')
          require('src/dungeon_v45_methods.inl', 'THÀNH VIÊN ĐỘI ĐANG CHỌN', 'team-only manager view missing')
          require('src/dungeon_v45_methods.inl', 'DungeonV47AddMemberFromManager', 'dedicated add-member flow missing')
          require('src/dungeon_v45_methods.inl', 'DungeonV47RemoveMemberFromManager', 'dedicated remove-member flow missing')
          require('src/dungeon_activity_bridge.inl', 'recttransform', 'Activity Unity-property filter missing')
          require('src/dungeon_presets.h', '9394,3009', 'approved Hoàng Kim 9394,3009 missing')
          require('src/dungeon_presets.h', '5881,4310', 'approved Huyền Phật 5881,2901 route row missing')
          require('src/dungeon_presets.h', '3279,2774', 'Trúc Lâm MOVE-only coordinate missing')
          require('src/dungeon_presets.h', '2039,2099', 'Dã Ngoại final coordinate missing')
          require('src/dungeon_presets.h', 'const int x[]={6637,6724,5849', 'Dung Nham 27-point route missing')
          require('src/dungeon_presets.h', 'Ác Tặc Tạo Phản • CHỜ ENTRY', 'Ác Tặc placeholder plan missing')
          require('src/dungeon_presets.h', '3127,3318,2243,1065,1345,708', 'Ác Tặc approved STEP coordinates missing')
          print('v4.7 approved source contracts PASS')

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests',
            'dungeon_v45_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.7 binaries and source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.7.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.7.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.7-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.7-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.7.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.7-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.7-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload v4.7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.7
          path: dist/*
          if-no-files-found: error

      - name: Publish clean v4.7 source and dist to main
        if: github.event_name == 'push'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git checkout -- .github/workflows/build-v41.yml
          git add -A
          git add -f dist
          git reset -- .github/workflows/build-v41.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: AUTO Phó Bản v4.7 release artifacts [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'publish v4.7 dist to main failed' }
          }
