# Canonical clean rebuild after temporary import workflow removal.
name: Build v4.2 AUTO Thần Long đa tính năng Pro

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'src/**'
      - 'tools/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v4.2 Xa Truyen source patch
        shell: powershell
        run: |
          python -c "import base64,gzip,pathlib; p=pathlib.Path('tools/v42-xa-truyen.patch.gz.b64'); pathlib.Path('tools/v42-xa-truyen.patch').write_bytes(gzip.decompress(base64.b64decode(p.read_text(encoding='ascii'))))"
          if ($LASTEXITCODE -ne 0) { throw 'v4.2 patch decode failed' }
          git apply --whitespace=nowarn tools/v42-xa-truyen.patch
          if ($LASTEXITCODE -ne 0) { throw 'v4.2 source patch failed' }
          Remove-Item tools/v42-xa-truyen.patch -Force
          Remove-Item tools/v42-xa-truyen.patch.gz.b64 -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v4.2 Xa Truyen travel network [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'v4.2 source commit failed' }

      - name: Verify source contracts
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          python tools/verify_v152_clean.py
          if ($LASTEXITCODE -ne 0) { throw 'core verifier failed' }
          python tools/test_tlmaster_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'TLMASTER verifier failed' }
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '4.2') { throw 'VERSION.txt is not 4.2' }
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'project(ThanLongItemConsolidator VERSION 4.2' -Quiet)) { throw 'CMake project version is not 4.2' }
          if (-not (Select-String -Path resources/app.rc -SimpleMatch 'FILEVERSION 4,2,0,0' -Quiet)) { throw 'EXE VERSIONINFO is not 4.2' }
          if (Select-String -Path src/controller.cpp -Pattern 'DisplayCoordToAutoPath' -Quiet) { throw 'coordinate scaling token still exists' }
          if (-not (Select-String -Path src/controller.cpp -Pattern 'kPreciseWorldTolerance = 20' -Quiet)) { throw 'precise world tolerance missing' }
          if (-not (Select-String -Path src/controller.cpp -Pattern 'PORTAL SPECIAL' -Quiet)) { throw 'interserver portal special routing missing' }
          if (-not (Select-String -Path src/controller.cpp -SimpleMatch 'V3.0 SHORTCUT FIRST' -Quiet)) { throw 'v3.3 initial train shortcut routing missing' }
          if (-not (Select-String -Path src/controller.cpp -SimpleMatch 'runtime NEVER reads these; ID387 uses sellNpcPositions_' -Quiet)) { throw 'Xa Truyen single coordinate source marker missing' }
          if (-not (Select-String -Path src/bridge.cpp -SimpleMatch 'SEMANTIC_SCAN CALLBACK PASS' -Quiet)) { throw 'v0.8-style semantic scanner missing' }
          if (-not (Select-String -Path src/controller.cpp -SimpleMatch 'arrived,kPreciseWorldTolerance); if(!arrived)return false;' -Quiet)) { throw 'treatment NPC precise tolerance missing' }

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests','dungeon_progress_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.2 binaries and source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.2.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.2.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.2-win-x64.zip -CompressionLevel Optimal -Force
          git archive --format=zip --output=dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.2-source.zip HEAD -- . ':(exclude)dist'
          if ($LASTEXITCODE -ne 0) { throw 'source archive failed' }
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.2.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.2-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.2-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.2
          path: dist/*
          if-no-files-found: error

      - name: Publish dist to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git add -A -f dist
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: publish AUTO Thần Long đa tính năng Pro v4.2 [skip ci]"
            git push origin HEAD:main
          }
