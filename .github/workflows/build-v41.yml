name: Build v4.9 AUTO Thần Long đa tính năng Pro

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'src/**'
      - 'tools/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AUTO_DUNGEON_RUNTIME_TEST_PLAN.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved v4.9 AUTO-core unification
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          from pathlib import Path
          import subprocess, sys

          patch = Path('tools/apply_v49_core_unification.py')
          source = patch.read_text(encoding='utf-8')
          old = '''# KEY authority follows RoleID, not a stale PID cache.\nreplace_once('src/dungeon_app_methods.inl',\n             '            Account* leader = AccountByPid(team.config.leaderPid);\\n',\n             '            Account* leader = DungeonAccountByRoleID(team.leaderRoleID);\\n',\n             required=False)\n# There are two identical leader declarations (NPC and Dialog); patch the second if present.\ntext = read('src/dungeon_app_methods.inl')\nneedle = '            Account* leader = AccountByPid(team.config.leaderPid);\\n'\nif needle in text:\n    write('src/dungeon_app_methods.inl', text.replace(needle,\n        '            Account* leader = DungeonAccountByRoleID(team.leaderRoleID);\\n', 1))\n'''
          new = '''# KEY authority follows RoleID, not a stale PID cache. Replace every Dungeon\n# leader lookup in this file; none of them should keep PID as authority.\ntext = read('src/dungeon_app_methods.inl')\nneedle = '            Account* leader = AccountByPid(team.config.leaderPid);\\n'\ncount = text.count(needle)\nif count < 2:\n    raise SystemExit(f'expected at least two Dungeon leader PID lookups, found {count}')\nwrite('src/dungeon_app_methods.inl', text.replace(needle,\n    '            Account* leader = DungeonAccountByRoleID(team.leaderRoleID);\\n'))\n'''
          if old in source:
              patch.write_text(source.replace(old, new, 1), encoding='utf-8')
          subprocess.check_call([sys.executable, 'tools/apply_v49_core_unification.py'])

      - name: Verify inherited safety contracts
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          source = Path('tools/verify_v152_clean.py').read_text(encoding='utf-8')
          replacements = {
              "== '4.4'": "== '4.9'",
              "VERSION 4.4": "VERSION 4.9",
              "FILEVERSION 4,4,0,0": "FILEVERSION 4,9,0,0",
              "PRODUCTVERSION 4,4,0,0": "PRODUCTVERSION 4,9,0,0",
              "Pro v4.4": "Pro v4.9",
              "Pro_v4.4.exe": "Pro_v4.9.exe",
              "Pro-v4.4-win-x64.zip": "Pro-v4.9-win-x64.zip",
              "0x00040200u": "0x00040900u",
              "SCAN FAIL • tiếp tục đánh, không được coi là hết quái": "SCAN FAIL • tiếp tục đánh, tuyệt đối không PASS",
              "TASK observer": "TASK manual-only",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          temp = Path('tools/_verify_v49_ci.py')
          temp.write_text(source, encoding='utf-8')
          try:
              subprocess.check_call([sys.executable, str(temp)])
              subprocess.check_call([sys.executable, 'tools/test_tlmaster_contract.py'])
          finally:
              temp.unlink(missing_ok=True)
          print('inherited safety contracts PASS under v4.9 product/version normalization')

      - name: Verify v4.9 unified-core contracts
        shell: python
        run: |
          from pathlib import Path

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def require(path, needle, message):
              if needle not in text(path):
                  raise SystemExit(message)

          def function_block(source, marker):
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'missing function marker: {marker}')
              brace = source.find('{', start)
              depth = 0
              i = brace
              state = 'normal'
              while i < len(source):
                  ch = source[i]
                  nx = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'line':
                      if ch == '\n': state = 'normal'
                  elif state == 'block':
                      if ch == '*' and nx == '/': state = 'normal'; i += 1
                  elif state == 'string':
                      if ch == '\\': i += 1
                      elif ch == '"': state = 'normal'
                  elif state == 'char':
                      if ch == '\\': i += 1
                      elif ch == "'": state = 'normal'
                  else:
                      if ch == '/' and nx == '/': state = 'line'; i += 1
                      elif ch == '/' and nx == '*': state = 'block'; i += 1
                      elif ch == '"': state = 'string'
                      elif ch == "'": state = 'char'
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0: return source[start:i + 1]
                  i += 1
              raise SystemExit(f'unterminated function: {marker}')

          if text('VERSION.txt').strip() != '4.9':
              raise SystemExit('VERSION.txt is not 4.9')
          require('CMakeLists.txt', 'project(ThanLongItemConsolidator VERSION 4.9', 'CMake project version is not 4.9')
          require('resources/app.rc', 'FILEVERSION 4,9,0,0', 'EXE VERSIONINFO is not 4.9')
          require('src/protocol.h', '0x00040900u', 'bridge protocol is not v4.9')

          require('src/controller.cpp', 'AUTO Thần Long đa tính năng Pro v4.9', 'v4.9 title missing')
          require('src/controller.cpp', 'a.runtime.running || a.pk.active || a.dungeonOwned', 'Dungeon does not share AUTO ReadState freeze/recovery')
          require('src/controller.cpp', '(!a.runtime.running && !a.dungeonOwned)', 'Dungeon-owned Priority Revive gate missing')
          require('src/controller.cpp', 's.riding && !a.dungeonOwned', 'Dungeon keep-mount policy missing')

          dungeon = text('src/dungeon_app_methods.inl')
          require('src/dungeon_app_methods.inl', 'AUTO PHÓ BẢN v4.9 • dùng trực tiếp CORE AUTO', 'v4.9 unified-core banner missing')
          require('src/dungeon_app_methods.inl', 'Account* DungeonAccountByRoleID', 'RoleID primary lookup missing')
          require('src/dungeon_app_methods.inl', 'Account* DungeonSlotAccount', 'RoleID slot resolver missing')
          require('src/dungeon_app_methods.inl', 'REFRESH ROLEID/PID • dùng Account CORE AUTO • không reset runtime', 'non-destructive active refresh missing')
          if '!DungeonAllStable(team, error)' in dungeon:
              raise SystemExit('global DungeonAllStable gate still controls TickDungeonTeam')
          if 'có acc chết ở PRECHECK' in dungeon:
              raise SystemExit('PRECHECK still fails instead of waiting for AUTO Life Guard')
          if 'timeout STEP ' in dungeon:
              raise SystemExit('Dungeon-specific STEP timeout failure still active')
          require('src/dungeon_app_methods.inl', 'STEP • chờ CORE AUTO nhận đủ participant theo RoleID', 'missing participant still fatal instead of WAIT')
          require('src/dungeon_app_methods.inl', 'ĐỢI MAP • chỉ chờ Map state từ CORE AUTO', 'WaitMap is not action-specific')

          fight = function_block(dungeon, '    bool TickDungeonFight(')
          for forbidden in ('InRadius(', 'MatchesRule(', 'step.radius', 'RefreshDungeonProgressSnapshot('):
              if forbidden in fight:
                  raise SystemExit(f'FIGHT-CLEAR still depends on forbidden filter/hot observer: {forbidden}')
          for needed in ('MonsterValidClassProof', 'MonsterValidLiveVitals', 'response.monsterTruncated',
                         'WAIT • SCAN FAIL', 'WAIT • có GMonster nhưng HP chưa chắc chắn',
                         'WAIT • còn GMonster VERIFIED sống', 'PASS • mọi GMonster VERIFIED sống = 0'):
              if needed not in fight:
                  raise SystemExit(f'FIGHT-CLEAR missing contract: {needed}')

          require('src/dungeon_app_methods.inl', 'SCAN ALL GMonster VERIFIED', 'simplified FIGHT UI wording missing')
          require('src/dungeon_app_methods.inl', 'TASK manual-only', 'TASK is not marked manual-only')
          require('src/dungeon_activity_bridge.inl', 'ACTIVITY LIVE_UI PASS', 'stable Activity reader missing')

          require('src/controller.cpp', 'parallelLaneCursor', 'multi-waypoint parallel runtime state missing')
          require('src/dungeon_v45_logic.h', 'sameLane', 'parallel lane validation missing')
          require('src/dungeon_presets.h', '9394,3009', 'approved Hoàng Kim route missing')
          require('src/dungeon_presets.h', '5881,4310', 'approved Huyền Phật route missing')
          require('src/dungeon_presets.h', '3279,2774', 'Trúc Lâm MOVE-only coordinate missing')
          require('src/dungeon_presets.h', '2039,2099', 'Dã Ngoại final coordinate missing')
          require('src/dungeon_presets.h', 'const int x[]={6637,6724,5849', 'Dung Nham 27-point route missing')
          require('src/dungeon_presets.h', '3127,3318,2243,1065,1345,708', 'Ác Tặc STEP coordinates missing')
          print('v4.9 unified AUTO-core/source contracts PASS')

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests',
            'dungeon_v45_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.9 binaries and source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload v4.9 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.9
          path: dist/*
          if-no-files-found: error

      - name: Publish clean v4.9 source and dist to main
        if: github.event_name == 'push'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git checkout -- .github/workflows/build-v41.yml
          git add -A
          git add -f dist
          git reset -- .github/workflows/build-v41.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: AUTO Phó Bản v4.9 unified AUTO core release artifacts [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'publish v4.9 dist to main failed' }
          }
