# One-time integration workflow: applies the approved v4.3 patch in CI, validates it,
# then a push-to-main run persists the clean patched source + binaries and removes the patcher.
name: Integrate v4.3 AUTO Phó Bản fixes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'tools/apply_v43_dungeon_fixes.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved v4.3 fixes
        shell: powershell
        run: |
          python tools/apply_v43_dungeon_fixes.py
          if ($LASTEXITCODE -ne 0) { throw 'v4.3 patch application failed' }
          Remove-Item tools/apply_v43_dungeon_fixes.py -Force
          @'
          from pathlib import Path
          p = Path('tools/verify_v152_clean.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Existing critical safety/role contracts stay present.'
          head, sep, tail = s.partition(marker)
          if not sep:
              raise SystemExit('verifier marker missing')
          head = head.replace('4,2,0,0', '4,3,0,0').replace('4.2', '4.3')
          head = head.replace("need('kProtocolVersion = 0x00040200u' in P, 'EXE/DLL protocol must be v4.3')",
                              "need('kProtocolVersion = 0x00040200u' in P, 'EXE/DLL protocol must remain 0x00040200')")
          p.write_text(head + sep + tail, encoding='utf-8')

          wf = Path('.github/workflows/build-v41.yml')
          t = wf.read_text(encoding='utf-8')
          lines = t.splitlines()
          for i, line in enumerate(lines):
              if 'dungeon InputSync reuse missing' in line:
                  lines[i] = line.replace('src/controller.cpp', 'src/dungeon_app_methods.inl')
              if 'dungeon scan-client button missing' in line:
                  indent = line[:len(line)-len(line.lstrip())]
                  lines[i] = indent + "if (-not (Select-String -Path src/dungeon_app_methods.inl -SimpleMatch 'IDC_DG_SCAN_CLIENT' -Quiet)) { throw 'dungeon scan-client button missing' }"
          wf.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v4.3 verifier normalization failed' }

      - name: Version metadata check
        shell: powershell
        run: |
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '4.3') { throw 'VERSION.txt is not 4.3' }
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'project(ThanLongItemConsolidator VERSION 4.3' -Quiet)) { throw 'CMake project version is not 4.3' }
          if (-not (Select-String -Path resources/app.rc -SimpleMatch 'FILEVERSION 4,3,0,0' -Quiet)) { throw 'EXE VERSIONINFO is not 4.3' }

      - name: ACC BAO CAO ownership check
        shell: powershell
        run: |
          if (-not (Select-String -Path src/telegram_account_filter.cpp -SimpleMatch 'kTelegramTabIndex = 3' -Quiet)) { throw 'ACC BAO CAO tab ownership fix missing' }

      - name: TASK enumerator check
        shell: powershell
        run: |
          if (-not (Select-String -Path src/bridge.cpp -SimpleMatch 'InvokeScalar(moveNext, ManagedThis(enumerator)' -Quiet)) { throw 'boxed task enumerator fix missing' }

      - name: Dungeon runtime reuse check
        shell: powershell
        run: |
          if (-not (Select-String -Path src/dungeon_app_methods.inl -SimpleMatch 'PriorityAutoOwner::Dungeon' -Quiet)) { throw 'dungeon InputSync reuse missing' }
          if (-not (Select-String -Path src/dungeon_app_methods.inl -SimpleMatch 'IDC_DG_SCAN_CLIENT' -Quiet)) { throw 'dungeon scan-client button missing' }

      - name: Core source verifier
        shell: powershell
        run: |
          python tools/verify_v152_clean.py
          if ($LASTEXITCODE -ne 0) { throw 'core verifier failed' }

      - name: TLMASTER verifier
        shell: powershell
        run: |
          python tools/test_tlmaster_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'TLMASTER verifier failed' }

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests','dungeon_progress_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.3 binaries and working-tree source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.3.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.3.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.3-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.3-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.3.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.3-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.3-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.3
          path: dist/*
          if-no-files-found: error

      - name: Persist clean v4.3 source and dist to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git add -A
          git add -f dist
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: AUTO Phó Bản v4.3 runtime + UI fixes [skip ci]"
            git push origin HEAD:main
          }
