name: Build v4.4 AUTO Thần Long đa tính năng Pro

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'src/**'
      - 'tools/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AUTO_DUNGEON_RUNTIME_TEST_PLAN.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time v4.4 dungeon presence integration if needed
        shell: powershell
        run: |
          if (Test-Path tools/apply_v44_dungeon_presence.py) {
            python tools/apply_v44_dungeon_presence.py
            if ($LASTEXITCODE -ne 0) { throw 'v4.4 patch application failed' }
            Remove-Item tools/apply_v44_dungeon_presence.py -Force
            Remove-Item tools/v44_xz_parts -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item tools/v44_patch_parts -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify v4.4 source contracts
        shell: powershell
        run: |
          python tools/verify_v152_clean.py
          if ($LASTEXITCODE -ne 0) { throw 'core verifier failed' }
          python tools/test_tlmaster_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'TLMASTER verifier failed' }
          if ((Get-Content VERSION.txt -Raw).Trim() -ne '4.4') { throw 'VERSION.txt is not 4.4' }
          if (-not (Select-String -Path CMakeLists.txt -SimpleMatch 'project(ThanLongItemConsolidator VERSION 4.4' -Quiet)) { throw 'CMake project version is not 4.4' }
          if (-not (Select-String -Path resources/app.rc -SimpleMatch 'FILEVERSION 4,4,0,0' -Quiet)) { throw 'EXE VERSIONINFO is not 4.4' }
          if (Select-String -Path src/dungeon_app_methods.inl -Pattern 'requiredKills|DeathTracker|team\.kills|CountDiagnostic' -Quiet) { throw 'old dungeon kill-counter logic remains' }
          if (-not (Select-String -Path src/dungeon_app_methods.inl -SimpleMatch 'Elapsed(now, team.lastScanTick, 5000)' -Quiet)) { throw '5-second monster presence scan missing' }
          if (-not (Select-String -Path src/dungeon_app_methods.inl -SimpleMatch 'HP / MaxHP' -Quiet)) { throw 'monster HP/name scan list missing' }
          if (-not (Select-String -Path src/bridge.cpp -SimpleMatch 'DungeonFindMethodFlexible' -Quiet)) { throw 'robust GetDoingTasks parser missing' }
          if (-not (Select-String -Path src/telegram_account_filter.cpp -SimpleMatch 'kTelegramTabIndex = 3' -Quiet)) { throw 'ACC BAO CAO tab ownership fix missing' }

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 14 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.4 binaries and source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.4.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.4.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.4-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.4-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.4.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.4-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.4-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload v4.4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.4
          path: dist/*
          if-no-files-found: error

      - name: Publish clean v4.4 source and dist to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git checkout -- .github/workflows/build-v41.yml
          git add -A
          git add -f dist
          git reset -- .github/workflows/build-v41.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: AUTO Phó Bản v4.4 monster-presence runtime + diagnostics [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'publish v4.4 dist to main failed' }
          }
