name: Build v4.5 AUTO Thần Long đa tính năng Pro

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v41.yml'
      - 'src/**'
      - 'tools/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AUTO_DUNGEON_RUNTIME_TEST_PLAN.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify inherited safety contracts
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          source = Path('tools/verify_v152_clean.py').read_text(encoding='utf-8')
          replacements = {
              "== '4.4'": "== '4.5'",
              "VERSION 4.4": "VERSION 4.5",
              "FILEVERSION 4,4,0,0": "FILEVERSION 4,5,0,0",
              "PRODUCTVERSION 4,4,0,0": "PRODUCTVERSION 4,5,0,0",
              "Pro v4.4": "Pro v4.5",
              "Pro_v4.4.exe": "Pro_v4.5.exe",
              "Pro-v4.4-win-x64.zip": "Pro-v4.5-win-x64.zip",
              "0x00040200u": "0x00040500u",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          temp = Path('tools/_verify_v45_ci.py')
          temp.write_text(source, encoding='utf-8')
          try:
              subprocess.check_call([sys.executable, str(temp)])
              subprocess.check_call([sys.executable, 'tools/test_tlmaster_contract.py'])
          finally:
              temp.unlink(missing_ok=True)
          print('inherited safety contracts PASS under v4.5 product/version normalization')

      - name: Verify v4.5 source contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def require(path, needle, message):
              if needle not in text(path):
                  raise SystemExit(message)

          if text('VERSION.txt').strip() != '4.5':
              raise SystemExit('VERSION.txt is not 4.5')
          require('CMakeLists.txt', 'project(ThanLongItemConsolidator VERSION 4.5', 'CMake project version is not 4.5')
          require('resources/app.rc', 'FILEVERSION 4,5,0,0', 'EXE VERSIONINFO is not 4.5')
          dungeon = text('src/dungeon_app_methods.inl')
          if re.search(r'requiredKills|DeathTracker|team\.kills|CountDiagnostic', dungeon):
              raise SystemExit('old dungeon kill-counter logic remains')
          required = [
              ('src/dungeon_app_methods.inl', 'Elapsed(now, team.lastScanTick, 5000)', '5-second monster presence scan missing'),
              ('src/dungeon_app_methods.inl', 'AUTO PHÓ BẢN: dùng core AUTO→ĐÁNH QUÁI của Tab AUTO', 'shared AUTO fight core missing'),
              ('src/controller.cpp', 'EnterDungeonTabSafetyStop()', 'dungeon tab ownership safety missing'),
              ('src/dungeon_v45_methods.inl', 'BẢNG HOẠT ĐỘNG PB', 'v4.5 activity board UI missing'),
              ('src/dungeon_activity_bridge.inl', 'ACTIVITY LIVE_UI PASS', 'live activity observer missing'),
              ('src/protocol.h', 'ReadDungeonActivityBoard = 28', 'activity-board bridge command missing'),
              ('src/dungeon_app_methods.inl', 'DungeonV45NotifyRunComplete', 'per-run dungeon Telegram missing'),
              ('src/dungeon_app_methods.inl', 'ValidateInheritedCoordinates', 'coordinate inheritance guard missing'),
              ('src/telegram_account_filter.cpp', 'kTelegramTabIndex = 3', 'ACC BAO CAO tab ownership fix missing'),
          ]
          for path, needle, message in required:
              require(path, needle, message)
          print('v4.5 source contracts PASS')

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests',
            'dungeon_v45_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage v4.5 binaries and source
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.5.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.5.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.5-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.5-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.5.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.5-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.5-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload v4.5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.5
          path: dist/*
          if-no-files-found: error

      - name: Publish clean v4.5 source and dist to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git checkout -- .github/workflows/build-v41.yml
          git add -A
          git add -f dist
          git reset -- .github/workflows/build-v41.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: AUTO Phó Bản v4.5 release artifacts [skip ci]"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'publish v4.5 dist to main failed' }
          }
