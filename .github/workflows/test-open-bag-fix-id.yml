name: Build isolated TEST OPEN BAG final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-open-bag-fix-id.yml'

permissions:
  contents: read

jobs:
  build-test-open-bag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify isolation contracts
        shell: python
        run: |
          from pathlib import Path
          protocol=Path('src/protocol.h').read_text(encoding='utf-8')
          controller=Path('src/controller.cpp').read_text(encoding='utf-8')
          bridge=Path('src/bridge.cpp').read_text(encoding='utf-8')
          generator=Path('tools/generate_image_scan_v4_sources.py').read_text(encoding='utf-8')
          required=['TestOpenBag = 25','IDC_TEST_OPEN_BAG = 5000','TEST MỞ TAY NẢI','Command::TestOpenBag']
          for token in required:
              if token not in protocol+controller+bridge:
                  raise SystemExit(f'missing TEST OPEN BAG token: {token}')
          if 'ClickInternalPointRawTest = 26' not in generator:
              raise SystemExit('V4 generator mapping is not compatible')
          start=bridge.index('// TEST-ONLY OPEN BAG')
          end=bridge.index('// END TEST-ONLY OPEN BAG')
          block=bridge[start:end]
          for forbidden in ['ClickInternalPoint(','InvokeInternalPointClick(','HandleClickEvent','InputSyncManager']:
              if forbidden in block:
                  raise SystemExit(f'open-bag test is not isolated: {forbidden}')
          print('TEST OPEN BAG isolation PASS')

      - name: Configure x64 Release
        shell: powershell
        env:
          TL_LICENSE_API_URL: ${{ vars.TL_LICENSE_API_URL }}
        run: |
          cmake -S . -B build -A x64 "-DTL_LICENSE_API_URL=$env:TL_LICENSE_API_URL"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run existing logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','trade_coordinator_logic_tests','background_ui_logic_tests',
            'fixed_slot_sell_logic_tests','unity_geometry_logic_tests','internal_ui_click_logic_tests',
            'travel_fight_guard_logic_tests','auto_fight_retry_logic_tests','telegram_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage isolated test package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test_dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe test_dist/TEST_OPEN_BAG_v9.9.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll test_dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path test_dist/TEST_OPEN_BAG_v9.9.exe,test_dist/ThanLongCleanRouteBridge.dll -DestinationPath test_dist/TEST_OPEN_BAG_v9.9_win-x64.zip -CompressionLevel Optimal -Force
          $items=@('test_dist/TEST_OPEN_BAG_v9.9.exe','test_dist/ThanLongCleanRouteBridge.dll','test_dist/TEST_OPEN_BAG_v9.9_win-x64.zip')
          foreach($p in $items){Get-FileHash $p -Algorithm SHA256 | Format-List}

      - name: Upload isolated test artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEST-OPEN-BAG-v9.9
          path: test_dist/*
          if-no-files-found: error
