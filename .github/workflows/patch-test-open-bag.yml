name: Patch TEST OPEN BAG generator compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-test-open-bag.yml'

permissions:
  contents: write

jobs:
  patch-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v9.9 Image Scan generator command mapping
        run: python .github/scripts/fix_test_open_bag_generator.py

      - name: Commit generator compatibility
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_image_scan_v4_sources.py
          if git diff --cached --quiet; then
            echo 'Generator already compatible.'
            exit 0
          fi
          git commit -m 'test: preserve isolated open-bag command in V4 generator [skip ci]'
          git push origin HEAD:main
