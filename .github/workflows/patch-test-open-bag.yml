name: Patch isolated TEST OPEN BAG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-test-open-bag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/coordinates, UIButton.HandleClickEvent, sell\/trade state/coordinates, native button callbacks, sell\/trade state/' .github/scripts/apply_test_open_bag.py
          python .github/scripts/apply_test_open_bag.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/protocol.h src/bridge.cpp src/controller.cpp
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git commit -m 'test: isolated semantic open-bag button [skip ci]'
          git push origin HEAD:main
