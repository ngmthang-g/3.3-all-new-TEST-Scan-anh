name: Finalize v4.9 unified AUTO core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hotfix-v49-persistence-run2.yml']

permissions:
  contents: write

jobs:
  final:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final persistence hotfix
        shell: python
        env:
          PYTHONIOENCODING: utf-8
        run: |
          import subprocess, sys
          subprocess.check_call([sys.executable, 'tools/apply_v49_persistence_hotfix.py'])

      - name: Verify v4.9 contracts
        shell: python
        run: |
          from pathlib import Path
          d=Path('src/dungeon_app_methods.inl').read_text(encoding='utf-8')
          c=Path('src/controller.cpp').read_text(encoding='utf-8')
          assert Path('VERSION.txt').read_text(encoding='utf-8').strip()=='4.9'
          assert 'Account* DungeonAccountByRoleID' in d and 'Account* DungeonSlotAccount' in d
          assert '!DungeonAllStable(team, error)' not in d
          fight=d[d.index('    bool TickDungeonFight('):d.index('    bool DungeonPostSellNeeded(')]
          for forbidden in ('InRadius(', 'MatchesRule(', 'step.radius', 'RefreshDungeonProgressSnapshot('):
              assert forbidden not in fight, forbidden
          for needed in ('MonsterValidClassProof','MonsterValidLiveVitals','response.monsterTruncated',
                         'WAIT • SCAN FAIL','WAIT • còn GMonster VERIFIED sống',
                         'PASS • mọi GMonster VERIFIED sống = 0'):
              assert needed in fight, needed
          assert 'Legacy-config fallback only: RoleID is missing' in d
          assert 'Account* leader = AccountByPid(team.config.leaderPid);' in d
          assert 'a.runtime.running || a.pk.active || a.dungeonOwned' in c
          assert '(!a.runtime.running && !a.dungeonOwned)' in c
          assert 's.riding && !a.dungeonOwned' in c
          print('final v4.9 source contracts PASS')

      - name: Configure and build x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if($LASTEXITCODE-ne 0){throw 'configure failed'}
          cmake --build build --config Release --parallel
          if($LASTEXITCODE-ne 0){throw 'build failed'}

      - name: Run 15 logic tests
        shell: powershell
        run: |
          $tests=@('route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests','background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests','internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests','auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests','dungeon_v45_logic_tests','travel_network_logic_tests')
          foreach($t in $tests){$p=Join-Path 'build/Release' ($t+'.exe');if(!(Test-Path $p)){throw "missing $p"};& $p;if($LASTEXITCODE-ne 0){throw "$t failed"}}

      - name: Stage final v4.9
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist|Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-win-x64.zip -CompressionLevel Optimal -Force
          $src=@('.github','resources','src','tools','CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','AUTO_DUNGEON_RUNTIME_TEST_PLAN.md','.gitignore')
          Compress-Archive -Path $src -DestinationPath dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_da_tinh_nang_Pro_v4.9.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-win-x64.zip','dist/AUTO-Than-Long-da-tinh-nang-Pro-v4.9-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"};$lines|Set-Content dist/SHA256SUMS.txt;Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-da-tinh-nang-Pro-v4.9-final
          path: dist/*
          if-no-files-found: error

      - name: Publish final v4.9
        shell: powershell
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git add -A;git add -f dist;git diff --cached --quiet
          if($LASTEXITCODE-ne 0){git commit -m "fix: finalize v4.9 unified AUTO core [skip ci]";git push origin HEAD:main;if($LASTEXITCODE-ne 0){throw 'publish failed'}}
