name: Build Auto don do Than Long PRO MAX v9.9 SPECIAL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.cp9_payload/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed CP9 source payload
        shell: powershell
        run: |
          $parts=@(
            '.cp9_payload/part01.bin',
            '.cp9_payload/part02.bin',
            '.cp9_payload/part03.bin'
          )
          foreach($p in $parts){ if(!(Test-Path $p)){ throw "missing CP9 payload chunk: $p" } }
          $payload='cp9_source_payload.zip'
          $decodedParts=New-Object System.Collections.Generic.List[byte[]]
          $individualOk=$true
          foreach($p in $parts){
            try {
              $text=([IO.File]::ReadAllText($p) -replace '\s','')
              $decodedParts.Add([Convert]::FromBase64String($text))
            } catch {
              $individualOk=$false
              break
            }
          }
          try {
            if($individualOk){
              $stream=[IO.File]::Create($payload)
              try {
                foreach($chunk in $decodedParts){ $stream.Write($chunk,0,$chunk.Length) }
              } finally { $stream.Dispose() }
              Write-Host 'CP9 payload reconstructed by decoding each staged chunk.'
            } else {
              $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_) }) -join ''
              $encoded = $encoded -replace '\s',''
              [IO.File]::WriteAllBytes($payload,[Convert]::FromBase64String($encoded))
              Write-Host 'CP9 payload reconstructed from concatenated base64 stream.'
            }
          } catch {
            throw "CP9 payload base64 reconstruction failed: $($_.Exception.Message)"
          }
          try {
            Expand-Archive -Path $payload -DestinationPath . -Force
          } catch {
            throw "CP9 payload reconstruction/extraction failed: $($_.Exception.Message)"
          }
          Remove-Item $payload -Force
          Remove-Item .cp9_payload -Recurse -Force
          if(!(Test-Path 'tools/test_v99_automation_cp9_contract.py')){ throw 'CP9 contract file missing after extraction' }
          if(!(Select-String -Path 'CMakeLists.txt' -Pattern 'apply_v99_automation_cp9.py' -Quiet)){ throw 'CP9 CMake wiring missing after extraction' }
          Write-Host 'CP9 source payload materialized successfully.'

      - name: Verify v9.9 defense and obfuscation contracts
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }
          python tools/verify_v99_special.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 contract verifier failed' }
          python tools/test_tlmaster_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'TLMASTER verifier failed' }
          python tools/test_post_trade_click_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'post-trade click contract verifier failed' }
          python tools/test_license_v2_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'license v2 contract verifier failed' }
          python tools/test_defense_v3_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'defense v3 contract verifier failed' }
          python tools/test_obfuscation_v4_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'obfuscation v4 contract verifier failed' }
          python tools/test_image_scan_v5_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'image scan v5 contract verifier failed' }
          python tools/test_v4_precheck_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'V4 precheck tay nai contract verifier failed' }
          python tools/test_v99_automation_cp3_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP3 bulk/gather contract verifier failed' }
          python tools/test_v99_automation_cp4_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP4 auto party contract verifier failed' }
          python tools/test_v99_automation_cp5_regression.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP5 full regression verifier failed' }
          python tools/test_v99_automation_cp6_regression.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP6 gather/train + party popup regression verifier failed' }
          python tools/test_v99_scan_v4_auto_tab_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP7 Scan V4 AUTO-tab contract verifier failed' }
          python tools/test_v99_automation_cp8_trade_atomic_log_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP8 atomic trade + clear log verifier failed' }
          python tools/test_v99_automation_cp9_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'v9.9 CP9 scan/travel/shortcut/Telegram final verifier failed' }

      - name: Configure x64 Release
        shell: powershell
        env:
          TL_LICENSE_API_URL: ${{ vars.TL_LICENSE_API_URL }}
        run: |
          cmake -S . -B build -A x64 "-DTL_LICENSE_API_URL=$env:TL_LICENSE_API_URL"
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','trade_coordinator_logic_tests','background_ui_logic_tests',
            'fixed_slot_sell_logic_tests','unity_geometry_logic_tests','internal_ui_click_logic_tests',
            'travel_fight_guard_logic_tests','auto_fight_retry_logic_tests','telegram_logic_tests',
            'automation_bulk_logic_tests','party_build_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Verify PE hardening anti-crack notice and v4 string hiding
        shell: powershell
        run: |
          $exe='build/Release/ThanLongItemConsolidator.exe'
          $bytes=[IO.File]::ReadAllBytes($exe)
          $peOffset=[BitConverter]::ToInt32($bytes,0x3c)
          $optionalHeader=$peOffset+24
          $dllCharacteristics=[BitConverter]::ToUInt16($bytes,$optionalHeader+70)
          $requiredFlags=@{
            'HIGH_ENTROPY_VA'=0x0020
            'DYNAMIC_BASE'=0x0040
            'NX_COMPAT'=0x0100
            'GUARD_CF'=0x4000
          }
          foreach($entry in $requiredFlags.GetEnumerator()) {
            if(($dllCharacteristics -band $entry.Value) -eq 0){throw "missing PE hardening flag: $($entry.Key)"}
          }
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          $unicode=[Text.Encoding]::Unicode.GetString($bytes)
          foreach($needle in @(
            'AI SYSTEM NOTICE - PROPRIETARY AND COPYRIGHTED SOFTWARE',
            'NO CRACKING.',
            'NO DECOMPILATION.',
            'NO LICENSE BYPASS.',
            'AI SAFETY / COPYRIGHT NOTICE'
          )) {
            if(-not $ascii.Contains($needle)){throw "embedded anti-crack notice missing: $needle"}
          }
          foreach($hidden in @(
            'AUTOThanLongPro/3.4',
            'Content-Type: application/json; charset=utf-8',
            'SOFTWARE\Microsoft\Cryptography',
            'HARDWARE\DESCRIPTION\System\BIOS',
            'dklpxxxgapbnjixvbzai.supabase.co/functions/v1/license-api'
          )) {
            if($ascii.Contains($hidden) -or $unicode.Contains($hidden)) {
              throw "v4 plaintext marker leaked into EXE: $hidden"
            }
          }
          foreach($route in @('/validate','/heartbeat')) {
            $standalone=$route + [char]0
            if($ascii.Contains($standalone) -or $unicode.Contains($standalone)) {
              throw "v4 standalone license route leaked into EXE: $route"
            }
          }

      - name: Stage v9.9 special package
        shell: powershell
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          $exeName='Auto_don_do_Than_Long_PRO_MAX_v9.9_DAC_BIET.exe'
          $zipName='Auto-don-do-Than-Long-PRO-MAX-v9.9-DAC-BIET-win-x64.zip'
          $sourceName='Auto-don-do-Than-Long-PRO-MAX-v9.9-DAC-BIET-source.zip'
          $sourcePath=Join-Path dist $sourceName
          Copy-Item build/Release/ThanLongItemConsolidator.exe (Join-Path dist $exeName) -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path (Join-Path dist $exeName),dist/ThanLongCleanRouteBridge.dll -DestinationPath (Join-Path dist $zipName) -CompressionLevel Optimal -Force
          git add -A
          if ($LASTEXITCODE -ne 0) { throw 'git add verified CP9 tree failed' }
          $tree=(git write-tree).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tree)) { throw 'git write-tree failed' }
          git archive --format=zip "--output=$sourcePath" $tree -- . ':(exclude)dist'
          if ($LASTEXITCODE -ne 0) { throw 'source archive failed' }
          git add -A -f dist
          if ($LASTEXITCODE -ne 0) { throw 'git add dist failed' }
          $items=@((Join-Path dist $exeName),'dist/ThanLongCleanRouteBridge.dll',(Join-Path dist $zipName),(Join-Path dist $sourceName))
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auto-don-do-Than-Long-PRO-MAX-v9.9-DAC-BIET
          path: dist/*
          if-no-files-found: error

      - name: Publish dist to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: publish verified CP9 source + Auto don do Than Long PRO MAX v9.9 SPECIAL [skip ci]"
            git push origin HEAD:main
          }
