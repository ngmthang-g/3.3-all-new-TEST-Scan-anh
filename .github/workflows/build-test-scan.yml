name: Build TEST FILTER v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-test-scan.yml'
      - 'test_scan/**'

permissions:
  contents: write

jobs:
  build-test-filter:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply proven TEST SCAN base and FILTER v3
        shell: powershell
        run: |
          python test_scan/apply_test_scan_poc.py
          if ($LASTEXITCODE -ne 0) { throw 'apply TEST SCAN base failed' }
          python test_scan/finalize_test_scan_poc.py
          if ($LASTEXITCODE -ne 0) { throw 'finalize FILTER v3 failed' }

      - name: Verify FILTER v3 source contracts
        shell: python
        run: |
          from pathlib import Path
          checks = {
              'src/controller.cpp': ['TEST SCAN ẢNH', 'OpenImageScanTest()', 'Command::ClickInternalPointRawTest'],
              'src/bridge.cpp': ['ClickInternalPointRawTest(', 'RAW TEST InputSync PASS', 'case Command::ClickInternalPointRawTest:'],
              'src/protocol.h': ['ClickInternalPointRawTest = 29'],
              'src/image_scan_test.cpp': ['image_scan_filter_v3.inl'],
              'src/image_scan_filter_v3.inl': [
                  'PrintWindow(', 'FindTemplate(', 'kMaxClickSteps = 20',
                  'ẢNH 1 • ĐỒ ĐÚNG', 'NÚT VỨT • scan rồi click đúng tâm',
                  'DẤU X • scan rồi click đúng tâm', 'CLICK SAU VỨT',
                  'LẶP LẠI CLICK', 'GetAsyncKeyState(VK_ESCAPE)'
              ],
              'CMakeLists.txt': ['src/image_scan_test.cpp', 'windowscodecs ole32'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle}')
          print('TEST FILTER v3 source contracts PASS')

      - name: Configure x64 Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }

      - name: Build x64 Release
        shell: powershell
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Run logic tests
        shell: powershell
        run: |
          $tests=@(
            'route_logic_tests','rotation_logic_tests','trade_coordinator_logic_tests',
            'background_ui_logic_tests','fixed_slot_sell_logic_tests','unity_geometry_logic_tests',
            'internal_ui_click_logic_tests','travel_fight_guard_logic_tests','auto_fight_retry_logic_tests',
            'auto_pk_logic_tests','telegram_logic_tests','inventory_filter_logic_tests','dungeon_logic_tests',
            'dungeon_v45_logic_tests','travel_network_logic_tests'
          )
          foreach($t in $tests){
            $p=Join-Path 'build/Release' ($t+'.exe')
            if(!(Test-Path $p)){throw "missing $p"}
            & $p
            if($LASTEXITCODE -ne 0){throw "$t failed"}
          }

      - name: Stage TEST FILTER v3 binaries and source
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/AUTO_Than_Long_v4.9_TEST_FILTER_V3.exe -Force
          Copy-Item build/Release/ThanLongCleanRouteBridge.dll dist/ThanLongCleanRouteBridge.dll -Force
          Compress-Archive -Path dist/AUTO_Than_Long_v4.9_TEST_FILTER_V3.exe,dist/ThanLongCleanRouteBridge.dll -DestinationPath dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-win-x64.zip -CompressionLevel Optimal -Force
          $sourceItems=@('CMakeLists.txt','README.md','CHANGELOG.md','VERSION.txt','src','resources','test_scan','tools','.github')
          Compress-Archive -Path $sourceItems -DestinationPath dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-source.zip -CompressionLevel Optimal -Force
          $items=@('dist/AUTO_Than_Long_v4.9_TEST_FILTER_V3.exe','dist/ThanLongCleanRouteBridge.dll','dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-win-x64.zip','dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-source.zip')
          $lines=foreach($p in $items){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();"$h  $([IO.Path]::GetFileName($p))"}
          $lines | Set-Content dist/SHA256SUMS_TEST_FILTER_V3.txt
          Get-Content dist/SHA256SUMS_TEST_FILTER_V3.txt

      - name: Upload TEST FILTER v3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-Than-Long-v4.9-TEST-FILTER-V3
          path: |
            dist/AUTO_Than_Long_v4.9_TEST_FILTER_V3.exe
            dist/ThanLongCleanRouteBridge.dll
            dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-win-x64.zip
            dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-source.zip
            dist/SHA256SUMS_TEST_FILTER_V3.txt
          if-no-files-found: error

      - name: Publish FILTER v3 source and binaries to main
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          git add CMakeLists.txt src test_scan
          git add -f dist/AUTO_Than_Long_v4.9_TEST_FILTER_V3.exe
          git add -f dist/ThanLongCleanRouteBridge.dll
          git add -f dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-win-x64.zip
          git add -f dist/AUTO-Than-Long-v4.9-TEST-FILTER-V3-source.zip
          git add -f dist/SHA256SUMS_TEST_FILTER_V3.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "feat: add TEST FILTER v3 20-slot image logic + x64 artifacts [skip ci]"
            git push origin HEAD:main
          }
