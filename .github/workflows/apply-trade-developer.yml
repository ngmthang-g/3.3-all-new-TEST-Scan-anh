name: Apply trade callback + developer tab

on:
  push:
    branches: [feature/trade-callback-developer]
    paths:
      - '.github/workflows/apply-trade-developer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/trade-callback-developer

      - name: Apply scoped source patch
        shell: powershell
        run: |
          python .github/scripts/apply_trade_callback_developer.py
          if ($LASTEXITCODE -ne 0) { throw 'patch failed' }
          python tools/test_trade_callback_developer_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'contract failed after patch' }
          git config core.whitespace cr-at-eol
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/protocol.h src/bridge.cpp src/controller.cpp
          git commit -m 'feat: callback Giao dich after target MAIN and add developer tab'
          git push origin HEAD:feature/trade-callback-developer
